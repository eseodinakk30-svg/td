name: Build 3D APK

on:
  push:
    branches:
      - main
      - claude/multiverse-character-game-4dw9gd
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4-stable
  GODOT_TEMPLATE_DIR: 4.4.stable

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools for signing
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot and export templates
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"
          godot --headless --version

      - name: Create debug keystore
        run: |
          set -eux
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the Android SDK
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import project
        working-directory: godot
        run: godot --headless --import || true

      - name: Run battle simulation
        working-directory: godot
        run: godot --headless --script res://tests/smoke.gd

      - name: Export APK
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -eux
          mkdir -p ../build
          godot --headless --export-debug "Android" ../build/multiarena.apk
          ls -la ../build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multiarena-3d-apk
          path: build/*.apk
          if-no-files-found: error
